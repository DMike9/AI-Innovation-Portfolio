[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htis-kv-research"
version = "0.2.0"
description = "Reproducible research sandbox for budgeted token-importance and KV-cache retention"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
legacy = ["torch>=2.0", "matplotlib>=3.7"]
context = ["torch==2.9.1", "transformers==4.57.6", "safetensors==0.8.0"]

[project.scripts]
htis-context = "htis_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pretrained: opt-in tests requiring the pinned pretrained checkpoint"]
