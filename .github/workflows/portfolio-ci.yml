name: Portfolio quality checks
on:
  push:
  pull_request:

jobs:
  transformer-research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transformer-efficiency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package and tests
        run: python -m pip install -e '.[test]'
      - name: Run transformer research tests
        run: pytest -q
      - name: Smoke-test reproducible synthetic report
        run: python -m htis.experiment --scenario mixed --steps 48 --budget 8 --sinks 2 --recent 2 --output /tmp/htis-report.json

  signalrank:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signalrank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signalrank/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  context-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transformer-efficiency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU reference environment
        run: |
          python -m pip install -r requirements-context.lock --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Offline reference and page tests (pretrained weights explicitly opt-in)
        run: python -m pytest -q -p no:cacheprovider
